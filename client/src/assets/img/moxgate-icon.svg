<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="moxgate-icon-title">
  <title id="moxgate-icon-title">Moxgate</title>
  <!-- Moxgate mark, built for small sizes: the gate arch and the M stay legible
       down to 16px, where the full logo's filigree and five gems turn to mush.
       Transparent background, tuned for dark UI. -->
  <defs>
    <linearGradient id="moxgate-icon-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="moxgate-icon-arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <path d="M3 50 Q 32 -20 61 50" fill="none" stroke="url(#moxgate-icon-arch)" stroke-width="5.5" stroke-linecap="round"/>
  <g transform="translate(32 36) scale(.72) translate(-32 -36)">
    <path fill="url(#moxgate-icon-gold)" d="M4 53 L4 48 L8 48 L8 21 L21 21 L32 38 L43 21 L56 21 L56 48 L60 48 L60 53 L42 53 L42 48 L46 48 L46 34 L35 50 L29 50 L18 34 L18 48 L22 48 L22 53 Z"/>
  </g>
  <path d="M32 51 L36.5 57 L32 63 L27.5 57 Z" fill="#a78bfa" stroke="#5b21b6" stroke-width="1"/>
</svg>
